# Railway config: use Dockerfile
[build]
  dockerfilePath = "fkapi/Dockerfile"

[deploy]
  startCommand = "gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 fkapi.wsgi:application"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 60
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
