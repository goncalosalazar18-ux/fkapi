version: '3'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
  
  redis:
    image: redis
  
  celery:
    build: .
    command: celery -A fkapi worker --loglevel=info
    depends_on:
      - redis
  
  celery-beat:
    build: .
    command: celery -A fkapi beat --loglevel=info
    depends_on:
      - redis