services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/fkapi
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery:
    build: .
    command: celery -A fkapi worker --loglevel=info
    volumes:
      - .:/fkapi
    depends_on:
      - redis

  celerybeat:
    build: .
    command: celery -A fkapi beat --loglevel=info --scheduler django
    volumes:
      - .:/fkapi
    depends_on:
      - redis

  redis:
    image: redis