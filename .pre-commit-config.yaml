# Pre-commit hooks configuration for Football Kit Archive API
# See https://pre-commit.com for more information

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Check for large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending

  # Django check
  - repo: local
    hooks:
      - id: django-check
        name: Django Check
        entry: bash -c 'cd fkapi && python manage.py check'
        language: system
        pass_filenames: false
        always_run: true
      
      - id: pytest-celery-tests
        name: Pytest Celery Tests
        entry: bash -c 'python -m pytest fkapi/core/tests/test_celery.py -v --tb=short'
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

# Global settings
default_language_version:
  python: python3.10

# Exclude certain files
exclude: |
  (?x)^(
    migrations/|
    static/|
    media/|
    logs/|
    .venv/|
    venv/|
    build/|
    dist/|
    __pycache__/
  )
