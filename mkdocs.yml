site_name: FKApi Documentation
site_description: Football Kit Archive API - Developer Documentation
site_url: http://localhost:8000/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: dark
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate

nav:
  - Home: README.md
  - Getting Started: GETTING_STARTED.md
  - Celery Setup: CELERY_SETUP.md
  - Architecture: architecture.md
  - Data Flow: data-flow.md
  - Developer Onboarding: developer-onboarding.md
  - Troubleshooting: troubleshooting.md
  - API:
    - Endpoint Catalog: api/endpoint-catalog.md
    - Usage Examples: api/usage-examples.md
  - Decisions:
    - Scraping Framework: decisions/0001-scraping-framework.md
    - Tooling and Standards: decisions/0002-tooling-and-standards.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - toc:
      permalink: true
